name: Update data and deploy

on:
  schedule:
    # Every 30 minutes, 09:00–23:30 UTC, Monday–Friday
    # (covers US pre-market from 04:00 ET through after-hours).
    - cron: "*/30 9-23 * * 1-5"
    # Once a day at weekends, so catalyst countdowns and the score stay current.
    - cron: "17 12 * * 0,6"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the run commits data/state.json (score log + last-good float/short data)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          fc-list | grep -qi dejavu || (sudo apt-get -qq update && sudo apt-get -qq install -y fonts-dejavu-core) || true

      - name: Test the scoring model
        run: python -m unittest discover tests

      - name: Fetch prices, filings and movers
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python scripts/update.py

      - name: Save the score log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -q -m "Score log [skip ci]" && git pull -q --rebase && git push -q) || echo "::warning::score log not saved this run"

      - name: Build site
        run: |
          mkdir -p _site/data
          cp index.html favicon.svg favicon.ico favicon-32.png apple-touch-icon.png _site/
          cp data/watchlist.json data/live.json _site/data/
          [ -f og.png ] && cp og.png _site/ || true
          [ -f CNAME ] && cp CNAME _site/ || true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
