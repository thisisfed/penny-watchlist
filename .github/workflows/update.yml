name: Update data and deploy

on:
  schedule:
    # Every 30 minutes, 09:00–23:30 UTC, Monday–Friday
    # (covers US pre-market from 04:00 ET through after-hours).
    - cron: "*/30 9-23 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices, filings and movers
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python scripts/update.py

      - name: Build site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/watchlist.json data/live.json _site/data/
          [ -f CNAME ] && cp CNAME _site/ || true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
