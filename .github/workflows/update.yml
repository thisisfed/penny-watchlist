name: Update data and deploy

on:
  schedule:
    # Twice an hour, 09:13–23:43 UTC, Monday–Friday (US pre-market through after-hours).
    # Deliberately off :00/:30 — GitHub drops most scheduled runs that ask for the busy minutes.
    - cron: "13,43 9-23 * * 1-5"
    # Extra passes after the US close so every session's scores get logged even if earlier runs were dropped.
    - cron: "23 0-3 * * 2-6"
    # Once a day at weekends, so catalyst countdowns and the scores stay current.
    - cron: "17 12 * * 0,6"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the run commits data/state.json (score log + last-good float/short data)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          fc-list | grep -qi dejavu || (sudo apt-get -qq update && sudo apt-get -qq install -y fonts-dejavu-core) || true

      - name: Test the scoring model
        run: python -m unittest discover tests

      - name: Fetch prices, filings and movers
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python scripts/update.py

      - name: Save the score log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Score log [skip ci]"
            for i in 1 2 3; do
              git pull -q --rebase && git push -q && exit 0
              sleep $((i * 5))
            done
            echo "::warning::score log not saved this run"
          fi

      - name: Build site
        run: |
          mkdir -p _site/data
          cp index.html favicon.svg favicon.ico favicon-32.png apple-touch-icon.png _site/
          cp data/watchlist.json data/live.json _site/data/
          [ -f og.png ] && cp og.png _site/ || true
          [ -f CNAME ] && cp CNAME _site/ || true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # GitHub's artifact API fails now and then; one retry clears it

      - name: Retry deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
